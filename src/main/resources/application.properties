spring.application.name=Yukla


spring.datasource.url=jdbc:postgresql://localhost:5432/olol
spring.datasource.username=postgres
spring.datasource.password=root123
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


jwt.secret=ThisIsVeryLongSecureSecretKeyForAutoMarketJwtAtLeast64CharsNoSpecial1234567890abcdef
jwt.expiration=86400000


springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.example.yukla

server.port=8080